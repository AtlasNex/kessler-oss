# bench-oss — self-hosted OSS agent builds for the Open Bench register (PLAN-v5 #22).
# Independently-owned instances, loopback-only; the lab model endpoint is injected at deploy
# time by deploy.sh from the honeypot env (no value is ever committed or printed).
name: bench-oss

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui@sha256:8b432fe0a65b91116afc7961365c6cca5379cc923171386a96691f3471f3cae9
    container_name: bench-openwebui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8080"
    environment:
      WEBUI_AUTH: "False"
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: ${LAB_BASE_URL}
      OPENAI_API_KEY: ${LAB_API_KEY}
      DEFAULT_MODELS: ${LAB_MODEL}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    volumes:
      - openwebui-data:/app/backend/data

  anythingllm:
    image: mintplexlabs/anythingllm@sha256:f26f30df46916b6e953e3a47ca98f48817726e3df635e62d4bfdd133292ecfff
    container_name: bench-anythingllm
    restart: unless-stopped
    # SYS_ADMIN per the upstream deployment docs (embedded collectors). Noted in README.
    cap_add:
      - SYS_ADMIN
    ports:
      - "127.0.0.1:8102:3001"
    environment:
      STORAGE_DIR: /app/server/storage
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_MODEL_PREF: ${LAB_MODEL}
      GENERIC_OPEN_AI_BASE_PATH: ${LAB_BASE_URL}
      GENERIC_OPEN_AI_API_KEY: ${LAB_API_KEY}
      DISABLE_TELEMETRY: "true"
      SERVER_PORT: "3001"
    volumes:
      - anythingllm-data:/app/server/storage
      - anythingllm-hot:/app/server/storage/hotdir

  litellm:
    image: ghcr.io/berriai/litellm@sha256:f63fb81b831b170ec16851e23c36ac5bf52ef106b271406429524a2ed730bbfd
    container_name: bench-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:8103:4000"
    environment:
      LAB_BASE_URL: ${LAB_BASE_URL}
      LAB_API_KEY: ${LAB_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_KEY}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro

volumes:
  openwebui-data:
  anythingllm-data:
  anythingllm-hot:
